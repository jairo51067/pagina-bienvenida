<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO BÁSICO -->
    <title>Continuar a la Experiencia Profesional | Jairo Cárdenas</title>
    <meta name="description" content="Página de acceso seguro para visualizar portafolio y servicios profesionales sin errores de navegación.">
    <link rel="canonical" href="https://tu-dominio.com/puente">

    <!-- OPEN GRAPH (Para Redes Sociales) -->
    <meta property="og:title" content="Acceso Directo - Jairo Cárdenas">
    <meta property="og:description" content="Haz clic para abrir la experiencia completa en tu navegador profesional.">
    <meta property="og:image" content="URL_DE_TU_FAVICON_GRANDE.png">
    <meta property="og:url" content="https://tu-dominio.com/puente">
    <meta property="og:type" content="website">

    <!-- FAVICON -->
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <style>
        /* (Mantenemos tus estilos anteriores con una pequeña mejora de contraste) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
            color: #1a1a1a;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 { font-size: 1.6rem; margin-bottom: 15px; }
        p { font-size: 1rem; line-height: 1.6; color: #444; }
        .btn {
            display: block;
            margin: 15px auto;
            padding: 16px 25px;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        .btn-main { background-color: #0062cc; } /* Azul con mejor contraste */
        .btn-wa { background-color: #1a9d4b; }   /* Verde con mejor contraste */
        .footer-note { font-size: 0.85rem; color: #777; margin-top: 25px; }
    </style>
</head>
<body>

    <!-- ARIA: Role main indica el contenido central de la página -->
    <main class="container" role="main">
        
        <header>
            <h1 id="main-title">¡Estás a un paso!</h1>
        </header>

        <section>
            <p id="description-text">
                Para garantizar que visualices todo nuestro contenido con la mejor calidad técnica, presiona el botón de abajo.
            </p>
            
            <!-- ARIA: aria-labelledby conecta el botón con el texto descriptivo -->
            <a href="https://jairo-cardenas-digital-card.vercel.app/" 
               id="open-external" 
               class="btn btn-main"
               role="button"
               aria-labelledby="main-title description-text">
               ACCEDER A LA EXPERIENCIA
            </a>

            <p style="margin-top: 20px; font-weight: bold;">¿Prefieres atención directa?</p>

            <!-- ARIA: aria-label proporciona un contexto claro al lector de pantalla -->
            <a href="https://wa.me/04127055024?text=Hola, necesito ayuda" 
               class="btn btn-wa"
               role="button"
               aria-label="Contactar a soporte técnico por WhatsApp">
               CHATEAR POR WHATSAPP
            </a>
        </section>

        <footer>
            <p class="footer-note">
                Esta página optimiza la conexión segura entre aplicaciones.
            </p>
        </footer>
    </main>

    <script>
        (function() {
            var url = "https://tu-sitio-web.com";
            var btn = document.getElementById('open-external');

            btn.addEventListener('click', function(e) {
                var ua = navigator.userAgent || navigator.vendor || window.opera;

                // Android Intent: Forzar salida de la App hacia Chrome
                if (/android/i.test(ua)) {
                    e.preventDefault();
                    var intentUrl = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
                    window.location.href = intentUrl;
                }
                // En iOS/Otros el enlace sigue su curso natural
            });
        })();
    </script>
</body>
</html>
